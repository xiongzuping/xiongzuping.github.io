<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="HOF radical reactor ECL schematic">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#131e45"/><stop offset="0.55" stop-color="#0d1430"/><stop offset="1" stop-color="#080d1e"/></linearGradient>
<radialGradient id="core"><stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
<radialGradient id="vig"><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#04060f" stop-opacity="0.6"/></radialGradient>
<linearGradient id="tgb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6d7cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#ffffff" opacity="0.045"/></pattern>
<filter id="b" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9"/></filter>
</defs>
<rect width="400" height="400" fill="url(#bg)"/>
<rect width="400" height="400" fill="url(#dots)"/>
<text x="200" y="70" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="#5eead4" text-anchor="middle">HOF</text>
<!-- 2D hydrogen-bonded framework: dashed H-bonds -->
<g stroke="#22d3ee" stroke-opacity="0.8" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="4 5">
<line x1="132" y1="102" x2="188" y2="102"/><line x1="212" y1="102" x2="268" y2="102"/>
<line x1="132" y1="162" x2="188" y2="162"/><line x1="212" y1="162" x2="268" y2="162"/>
<line x1="132" y1="222" x2="188" y2="222"/><line x1="212" y1="222" x2="268" y2="222"/>
<line x1="120" y1="114" x2="120" y2="158"/><line x1="120" y1="166" x2="120" y2="210"/>
<line x1="200" y1="114" x2="200" y2="158"/><line x1="200" y1="166" x2="200" y2="210"/>
<line x1="280" y1="114" x2="280" y2="158"/><line x1="280" y1="166" x2="280" y2="210"/>
</g>
<g fill="#e2e8f0" opacity="0.9">
<circle cx="160" cy="102" r="2.6"/><circle cx="240" cy="102" r="2.6"/>
<circle cx="160" cy="162" r="2.6"/><circle cx="240" cy="162" r="2.6"/>
<circle cx="160" cy="222" r="2.6"/><circle cx="240" cy="222" r="2.6"/>
<circle cx="120" cy="136" r="2.6"/><circle cx="120" cy="188" r="2.6"/>
<circle cx="200" cy="136" r="2.6"/><circle cx="200" cy="188" r="2.6"/>
<circle cx="280" cy="136" r="2.6"/><circle cx="280" cy="188" r="2.6"/>
</g>
<!-- framework nodes -->
<g fill="#2dd4bf" fill-opacity="0.08" stroke="#2dd4bf" stroke-opacity="0.95" stroke-width="2.6">
<circle cx="120" cy="102" r="10"/><circle cx="200" cy="102" r="10"/><circle cx="280" cy="102" r="10"/>
<circle cx="120" cy="162" r="10"/><circle cx="200" cy="162" r="10"/><circle cx="280" cy="162" r="10"/>
<circle cx="120" cy="222" r="10"/><circle cx="200" cy="222" r="10"/><circle cx="280" cy="222" r="10"/>
</g>
<!-- radicals generated in pores -->
<circle cx="160" cy="132" r="24" fill="#fbbf24" opacity="0.22" filter="url(#b)"/>
<circle cx="240" cy="192" r="24" fill="#fbbf24" opacity="0.22" filter="url(#b)"/>
<g fill="#fbbf24">
<circle cx="160" cy="132" r="4.2"/><circle cx="240" cy="132" r="3.6"/><circle cx="160" cy="192" r="3.6"/><circle cx="240" cy="192" r="4.2"/>
</g>
<!-- radicals feed the ECL emission -->
<g stroke="#fbbf24" stroke-opacity="0.8" stroke-width="2" stroke-dasharray="4 4">
<line x1="160" y1="138" x2="200" y2="252"/><line x1="240" y1="138" x2="200" y2="252"/>
<line x1="160" y1="198" x2="200" y2="252"/><line x1="240" y1="198" x2="200" y2="252"/>
</g>
<circle cx="200" cy="258" r="28" fill="#fbbf24" opacity="0.25" filter="url(#b)"/>
<circle cx="200" cy="258" r="38" fill="url(#core)" opacity="0.5"/>
<rect x="170" y="258" width="60" height="50" fill="#22d3ee" opacity="0.1" filter="url(#b)"/>
<!-- electrode -->
<rect x="90" y="308" width="220" height="8" rx="4" fill="#f87171" opacity="0.35" filter="url(#b)"/>
<rect x="90" y="308" width="220" height="8" rx="4" fill="#f87171" opacity="0.9"/>
<text x="200" y="352" font-family="Arial, sans-serif" font-size="12" font-weight="500" letter-spacing="2" fill="#fca5a5" text-anchor="middle">ENHANCED ECL</text>
<rect width="400" height="400" fill="url(#vig)"/>
<g><rect x="15" y="15" rx="13" width="116" height="26" fill="#070b1a" opacity="0.9" stroke="url(#tgb)" stroke-width="1"/><text x="73" y="32.5" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.5" fill="#2dd4bf" text-anchor="middle">HOF REACTOR</text></g>
</svg>
