<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Liquid-ionic fluorescent polymeric probe schematic">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#131e45"/><stop offset="0.55" stop-color="#0d1430"/><stop offset="1" stop-color="#080d1e"/></linearGradient>
<radialGradient id="core"><stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
<radialGradient id="vig"><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#04060f" stop-opacity="0.6"/></radialGradient>
<linearGradient id="tgb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6d7cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#ffffff" opacity="0.045"/></pattern>
<filter id="b" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9"/></filter>
</defs>
<rect width="400" height="400" fill="url(#bg)"/>
<rect width="400" height="400" fill="url(#dots)"/>
<!-- fluorescence halo -->
<circle cx="200" cy="205" r="110" fill="#a78bfa" opacity="0.1" filter="url(#b)"/>
<circle cx="200" cy="205" r="70" fill="#22d3ee" opacity="0.12" filter="url(#b)"/>
<text x="332" y="50" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1" fill="#5eead4" text-anchor="middle">Φ ↑</text>
<!-- polymer backbone -->
<path d="M40 250 Q 110 190 190 240 T 360 250" stroke="#6d7cff" stroke-opacity="0.85" stroke-width="3.5" fill="none"/>
<g fill="#0a0f22" stroke="#6d7cff" stroke-opacity="0.9" stroke-width="2.4">
<circle cx="72" cy="231" r="7"/><circle cx="120" cy="215" r="7"/><circle cx="168" cy="214" r="7"/><circle cx="216" cy="227" r="7"/><circle cx="264" cy="246" r="7"/><circle cx="312" cy="254" r="7"/><circle cx="352" cy="252" r="7"/>
</g>
<!-- imidazolium side groups -->
<g stroke="#fbbf24" stroke-width="2.2" fill="#0a0f22" stroke-opacity="0.95">
<polygon points="168,194 178,199 174,211 162,211 158,199"/>
<polygon points="254,231 274,236 270,248 258,248 264,226"/>
</g>
<line x1="168" y1="214" x2="168" y2="199" stroke="#fbbf24" stroke-width="2.2" stroke-opacity="0.9"/>
<line x1="264" y1="246" x2="264" y2="231" stroke="#fbbf24" stroke-width="2.2" stroke-opacity="0.9"/>
<text x="168" y="207" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#fcd34d" text-anchor="middle">+</text>
<text x="264" y="239" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#fcd34d" text-anchor="middle">+</text>
<!-- anions with regulated charge density (size decreases) -->
<line x1="134" y1="208" x2="104" y2="190" stroke="#67e8f9" stroke-opacity="0.7" stroke-width="1.8" stroke-dasharray="4 5"/>
<circle cx="90" cy="184" r="10" fill="#0a0f22" stroke="#f87171" stroke-width="2.6"/>
<text x="90" y="184" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#fca5a5" text-anchor="middle" dominant-baseline="central">−</text>
<line x1="184" y1="204" x2="212" y2="176" stroke="#67e8f9" stroke-opacity="0.55" stroke-width="1.8" stroke-dasharray="4 5"/>
<circle cx="218" cy="172" r="8.5" fill="#0a0f22" stroke="#f87171" stroke-width="2.4"/>
<text x="218" y="172" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fca5a5" text-anchor="middle" dominant-baseline="central">−</text>
<line x1="279" y1="240" x2="309" y2="210" stroke="#67e8f9" stroke-opacity="0.4" stroke-width="1.8" stroke-dasharray="4 5"/>
<circle cx="315" cy="206" r="6.5" fill="#0a0f22" stroke="#f87171" stroke-width="2" opacity="0.75"/>
<text x="315" y="206" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#fca5a5" opacity="0.75" text-anchor="middle" dominant-baseline="central">−</text>
<text x="200" y="288" font-family="Arial, sans-serif" font-size="9" font-weight="500" letter-spacing="1" fill="#67e8f9" opacity="0.55" text-anchor="middle">REGULATED ANION CHARGE DENSITY</text>
<!-- emissive centre -->
<circle cx="216" cy="227" r="26" fill="url(#core)" opacity="0.55"/>
<g stroke="#67e8f9" stroke-opacity="0.5" stroke-width="1.8" stroke-linecap="round">
<line x1="216" y1="227" x2="216" y2="185"/><line x1="216" y1="227" x2="258" y2="225"/><line x1="216" y1="227" x2="216" y2="269"/><line x1="216" y1="227" x2="174" y2="225"/>
</g>
<g fill="#e2e8f0" opacity="0.5">
<circle cx="232" cy="207" r="2.2"/><circle cx="200" cy="203" r="2.2"/><circle cx="202" cy="249" r="2.2"/><circle cx="232" cy="247" r="2.2"/>
</g>
<rect width="400" height="400" fill="url(#vig)"/>
<g><rect x="15" y="15" rx="13" width="190" height="26" fill="#070b1a" opacity="0.9" stroke="url(#tgb)" stroke-width="1"/><text x="110" y="32.5" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.5" fill="#fbbf24" text-anchor="middle">LIQUID-IONIC PROBE</text></g>
</svg>
